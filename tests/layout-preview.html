<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Touchline responsive layout check</title><style>*{box-sizing:border-box}body{margin:0;background:#eef0f4;font-family:sans-serif}header{padding:12px;background:#fff;font-size:12px;display:flex;gap:20px}a{color:#775642}#stage{position:relative;overflow:hidden}iframe{border:0;transform-origin:0 0;display:block}</style></head><body><header><a href="?width=1440">Desktop 1440px</a><a href="?width=390">Mobile 390px</a><a href="../">Open app</a></header><div id="stage"><iframe src="../" title="Football dashboard layout preview"></iframe></div><script>const width=Number(new URLSearchParams(location.search).get('width'))||1440;const iframe=document.querySelector('iframe');const stage=document.querySelector('#stage');function fit(){const scale=Math.min(1,window.innerWidth/width);iframe.style.width=width+'px';iframe.style.height='1440px';iframe.style.transform=`scale(${scale})`;stage.style.height=1440*scale+'px'}window.addEventListener('resize',fit);fit();</script></body></html>
